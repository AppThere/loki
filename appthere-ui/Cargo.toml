[package]
name = "appthere-ui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "AppThere suite shared UI components and design tokens"
repository = "https://github.com/appthere/loki"

[lib]
name = "appthere_ui"
path = "src/lib.rs"

[dependencies]
dioxus     = { workspace = true }
loki-i18n  = { path = "../loki-i18n" }
# Smooth-scroll animation ticks: a worker thread sleeps and signals the UI task
# through an mpsc channel, because dioxus-native has no async timer and Blitz
# no per-element animation clock (Spec 08 S0.1 / scroll::animate).
futures-channel = "0.3"
# StreamExt::next, to drain those ticks on the UI thread.
futures-util = { version = "0.3", default-features = false }
# A reposition loop (popover::interaction_anchor) must surface as a log line
# rather than as a frame-rate complaint. A counter with no production voice is
# an instrument that speaks only where the hazard is not.
tracing = "0.1"
