[package]
name = "loki-app-shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared application-shell logic (tabs, blank documents, recent list) for the Loki suite binaries"
repository = "https://github.com/appthere/loki"
keywords = ["document", "shell", "loki"]
categories = ["gui"]

[dependencies]
appthere-ui = { path = "../appthere-ui" }
loki-i18n = { path = "../loki-i18n" }
loki-spell = { path = "../loki-spell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A failed calibration save is worth reporting: the reader will be asked to
# measure their screen again, and a silent discard makes that look like a bug.
tracing = "0.1"
dirs = "6"
# OS locale detection for picking the user's initial dictionary.
sys-locale = "0.3"
# Dictionary download transport. rustls (pure Rust) to match the blitz-net patch
# — `native-tls` would pull libssl.so, which is absent on Android. `blocking`
# because the fetcher runs on a dedicated worker thread, never the UI loop.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "blocking",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# X11/RandR physical-display query for Actual Size (Spec 08 T5.5). Already in
# the lockfile — winit's own X11 backend uses it — so this is a manifest line
# and no new transitive weight, which is the same measurement that chose
# `sysinfo` over an `unsafe_code` exception for the memory probe.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["randr"] }
