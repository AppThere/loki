[package]
name        = "appthere-canvas"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"
description = "Generic GPU canvas infrastructure for AppThere applications"

[features]
default    = []
# `gpu` enables the wgpu-backed `GpuTexture` handle and the `PageSource` trait
# used by loki-renderer. These types were the whole of `loki-render-cache`,
# deleted by Spec 08 D-10 / T2.4 and folded in here — see ADR-0016.
gpu        = ["dep:wgpu"]
font-cache = ["dep:peniko"]

[dependencies]
peniko     = { version = "0.5", optional = true }
read-fonts = "0.40"
thiserror  = { workspace = true }
wgpu       = { version = "26", optional = true }
