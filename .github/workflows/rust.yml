name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast-failing quality gates mandated by CLAUDE.md: formatting and clippy.
  # These run first so style/lint regressions surface before the slower build.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain (rustfmt + clippy)
      # Pinned, NOT `@stable`. Clippy widens lints between releases, so a
      # floating CI toolchain can fail on lints a developer's older local
      # toolchain cannot report — a drift only discoverable by pushing.
      # Keep this version in step with rust-toolchain.toml, which is what
      # cargo actually honours; naming it here just avoids installing a
      # second, unused toolchain.
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.97.1"
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: License-header gate (per-crate SPDX on line 1)
      # loki-opc is MIT (released standalone); the rest of the suite is
      # Apache-2.0. See docs/adr/0010-per-crate-licensing.md.
      run: python3 scripts/check-license-headers.py
    - name: Panic-guard gate (no panic!/todo!/unimplemented! in lib src)
      # Spec 01 audit A-6. unreachable! with a message is permitted.
      run: python3 scripts/check-no-panics.py
    - name: Unsafe-policy gate (forbid, or deny + allow-list)
      # Spec 01 audit A-7. Only the 3 Android cdylib crates may use deny+allow.
      run: python3 scripts/check-unsafe-policy.py
    - name: File-ceiling gate (300-line ratchet)
      # Spec 01 audit A-2. New files <= 300 lines; baselined debt may not grow.
      run: python3 scripts/check-file-ceiling.py
    - name: Suppression ratchet (`let _ =` swallows + `#[allow]`)
      # Audit Q-3/Q-4. Per-file counts may only shrink; new files start at 0/0.
      run: python3 scripts/check-suppressions.py
    - name: TODO-format gate (TODO(<topic>) tags)
      # Spec 01 audit A-11. No bare TODO / FIXME / HACK / XXX in production code.
      run: python3 scripts/check-todo-format.py
    - name: Dependency-direction gate (acyclic, downhill-only)
      # Spec 01 audit A-13 / ADR-0009. Fails on any uphill internal edge.
      run: python3 scripts/check-dependency-direction.py
    - name: Macro-interpreter purity gate (no I/O deps; not server-linked)
      # Macro spec §4.3/§10/§12: loki-basic links only its tiny allow-list and
      # no server/headless crate links the interpreter.
      run: python3 scripts/check-loki-basic-pure.py
    - name: Viewport-dimension guard (no assumed screen sizes)
      # Spec 01 audit A-1. No bare 1280-class literals in editor input/viewport paths.
      run: python3 scripts/check-no-hardcoded-viewport-dims.py
    - name: Arc::get_mut ban in loki-layout (copy-on-write must not be fallible)
      # Spec 09 L9-016. Arc::get_mut returns None whenever the layout is shared —
      # always, for a cached one — so it silently skips the mutation. Use make_mut.
      run: python3 scripts/check-arc-get-mut.py
    - name: Format check
      run: cargo fmt --all --check
    - name: Clippy (workspace, all features, warnings denied)
      # `unwrap_used`/`expect_used` keep panicking calls out of library runtime
      # code (audit A-5); clippy.toml exempts test code. Tooling (build.rs, the
      # gen_templates bin) carries a scoped file-level allow.
      run: cargo clippy --workspace --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

  # Spec 08 L08-014: every supported target builds in CI. Android is a supported
  # target and was NOT built here, so merge cce9772 could leave `loki-text` with
  # two `android_main` definitions (E0428) for three weeks without any job going
  # red — both copies sit behind `#[cfg(target_os = "android")]`, which the jobs
  # above never compile. This job is the gate that closes that class.
  #
  # `cargo check`, not `cargo build`: it type-checks the cfg'd code (which is all
  # that was ever wrong) without linking a cdylib, and needs no SDK, d8 or
  # keystore. The NDK is still required because `ring` (via reqwest/rustls)
  # compiles C in its build script even under `check`.
  android-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain (+ Android target)
      # Pinned — see the lint job and rust-toolchain.toml.
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.97.1"
        targets: aarch64-linux-android
    - uses: Swatinem/rust-cache@v2
      with:
        # Distinct cache: this job's artifacts are for a different target triple
        # and must not share a key with the host build.
        key: android
    - name: Point cargo and cc-rs at the runner's preinstalled NDK
      # ubuntu-latest ships the Android NDK; no download step needed. API 26 is
      # loki-text's min_sdk_version (Cargo.toml [package.metadata.android.sdk]).
      # Fail loudly if the layout ever changes rather than falling back to a
      # host compiler and producing a meaningless pass.
      run: |
        NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
        BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
        CLANG="$BIN/aarch64-linux-android26-clang"
        if [ ! -x "$CLANG" ]; then
          echo "::error::Android NDK clang not found at $CLANG"
          ls "$BIN" 2>/dev/null | head -20
          exit 1
        fi
        {
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
          echo "CC_aarch64_linux_android=$CLANG"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar"
        } >> "$GITHUB_ENV"
    - name: Check loki-text for Android
      # Default features, matching what an APK actually ships.
      # TODO(android-ci): add `-p loki-spreadsheet -p loki-presentation` once
      # those two crates build again (Spec 08 R11) — they share this entry point
      # via `loki_app_shell::android_main!`, so they are exposed to the same
      # class of break and are currently unguarded.
      run: cargo check --target aarch64-linux-android -p loki-text

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain
      # Pinned — see the lint job and rust-toolchain.toml.
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.97.1"
    - uses: Swatinem/rust-cache@v2
    - name: Install conformance tools (xmllint, pdftoppm)
      # Spec 02 gates, all running as ordinary cargo tests in this job:
      # - schema axis (M2): loki-{ooxml,odf} schema_validation.rs shell to
      #   xmllint against the vendored ISO 29500 / ODF schemas — HARD gate.
      # - round-trip axis (M3): conformance_round_trip.rs suites — HARD gate.
      # - visual axis (M5): loki-render-cpu visual_golden.rs compares
      #   vello_cpu renders to the committed LO goldens at the calibrated
      #   tolerance; needs pdftoppm only for the raster wrapper's own tests.
      #   Advisory-by-construction: the known kerning divergence is pinned as
      #   an expected-failure canary (see goldens/CALIBRATION.md).
      # Each harness fails loudly if its tool is absent — never skips.
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils poppler-utils
    # `--all-features` so the feature-gated format crates (pptx, xlsx) and their
    # integration tests actually compile and run — under the default feature set
    # `cargo test --workspace` silently skips `#![cfg(feature = ...)]` suites.
    - name: Build
      run: cargo build --workspace --all-features --verbose
    - name: Run tests
      run: cargo test --workspace --all-features --verbose
