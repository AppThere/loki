[package]
name = "loki-templates"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Bundled document templates (Markdown, APA, MLA, Screenplay, Resume) shipped as .dotx assets"

[dependencies]
loki-doc-model = { path = "../loki-doc-model" }
loki-ooxml = { path = "../loki-ooxml" }
loki-primitives = { path = "../loki-primitives" }

[dev-dependencies]
# The bundled-faces-only guarantee (round_trip.rs) is checked against the
# actual bundled set rather than a copied name list.
loki-fonts = { path = "../loki-fonts" }
